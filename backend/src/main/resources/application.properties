# ==============================================================================
# NextHire Backend — Application Configuration
# ==============================================================================
# This file configures the Spring Boot application.
# The app currently runs WITHOUT a database (using in-memory mock data).
# MySQL configuration is commented out — uncomment when ready to integrate.
# ==============================================================================

# Application Name
spring.application.name=nexthire-backend

# Server Port (respects PORT env var from Render, Railway, etc., defaults to 8080)
server.port=${PORT:8080}
server.address=0.0.0.0

# Context path — all APIs will be accessible at /api/...
# (This is set per-controller with @RequestMapping, not globally here)

# ==============================================================================
# DATABASE CONFIGURATION
# Default: Zero-setup in-memory H2 database (runs instantly without MySQL installed)
# To use MySQL: Set DB_URL, DB_USERNAME, DB_PASSWORD environment variables or update below
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:nexthire;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:}

# HikariCP connection pool settings for cloud database stability
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.com.nexthire=DEBUG
logging.level.org.springframework.web=INFO

# ==============================================================================
# JACKSON — JSON formatting
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ==============================================================================
# SPRINGDOC / SWAGGER UI
# Swagger UI available at: http://localhost:8080/swagger-ui.html
# OpenAPI JSON at:         http://localhost:8080/v3/api-docs
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==============================================================================
# CORS — Configured in CorsConfig.java
# Set allowed origins here for easier environment-specific overriding
# ==============================================================================
nexthire.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}
